name: Flutter Build & Deploy to Firebase App Distribution

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب الكود من المستودع
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. إعداد بيئة Java لبناء تطبيقات Android
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. إعداد بيئة Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. تثبيت Node.js و Firebase CLI
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # 5. تثبيت حزم مشروع Flutter
      - name: Install Dependencies
        run: flutter pub get

      # 6. بناء ملف الـ APK
      - name: Build Android APK
        run: flutter build apk --release

      # 7. رفع ملف الـ APK إلى Firebase App Distribution مباشرة
      - name: Upload to Firebase App Distribution
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          echo "$GCP_SA_KEY" > service_account.json
          export GOOGLE_APPLICATION_CREDENTIALS=service_account.json
          firebase appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
            --app "${{ secrets.FIREBASE_APP_ID }}" \
            --groups "testers"
          rm service_account.json